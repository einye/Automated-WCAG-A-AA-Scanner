<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
      background-color: #f9fafb;
      color: #111827;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      background-color: #2563eb;
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    #status {
      margin-top: 1rem;
      color: #16a34a;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>Settings</h1>
  <div class="form-group">
    <label for="backendUrl">Backend API URL:</label>
    <input type="text" id="backendUrl" placeholder="http://localhost:3000">
  </div>
  <div class="form-group">
    <label for="frontendUrl">Frontend Dashboard URL:</label>
    <input type="text" id="frontendUrl" placeholder="http://localhost:5173">
  </div>
  <button id="save">Save Settings</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
