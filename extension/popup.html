<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Checker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Accessibility Scan</h1>
      <p>Scan this page for WCAG compliance.</p>
    </header>

    <div id="controls">
      <button id="scanBtn">Scan Current Page</button>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <span>Scanning page... Results will open automatically in your dashboard.</span>
    </div>

    <div id="error" class="hidden error-box"></div>

    <div id="results" class="hidden">
      <p style="text-align: center; color: #4b5563; font-size: 0.875rem; margin-bottom: 1rem;">
        Scan completed! Results are loaded in the dashboard.
      </p>
      
      <div class="score-card">
        <h2>Overall Score</h2>
        <div class="score-value" id="overallScore">-</div>
      </div>
      
      <div class="group-scores">
        <div class="group">
          <span>Visual</span>
          <strong id="visualScore">-</strong>
        </div>
        <div class="group">
          <span>Motor</span>
          <strong id="motorScore">-</strong>
        </div>
        <div class="group">
          <span>Cognitive</span>
          <strong id="cognitiveScore">-</strong>
        </div>
      </div>

      <div class="actions" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem;">
        <button id="viewResultsBtn" style="width: 100%; background-color: #10b981; color: white; padding: 0.5rem 1rem; border: none; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; font-weight: 600;">
          View Full Results
        </button>
        <a id="pdfLink" href="#" target="_blank" class="download-btn hidden" style="text-align: center; text-decoration: none;">
          Download PDF Report
        </a>
      </div>
    </div>
  </div>
  
  <div class="settings-link">
    <a href="#" id="openOptions">Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
